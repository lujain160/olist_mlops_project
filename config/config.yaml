Paths:
  data_dir: "data"
  model_dir: "models"
  train_feature: "data/train_feature.csv"
  train_labels: "data/train_labels.csv"
  val_feature: "data/validation_feature.csv"
  val_labels: "data/validation_labels.csv"
  test_feature: "data/test_feature.csv"
  test_labels: "data/test_labels.csv"

model_params:
  random_state: 42
  target_col: "is_late"

api:
  host: "0.0.0.0"
  port: 8000
  title: "Olist Delivery Late Prediction API"

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "Olist_Shipping_Delay_Experiment"
  model_name: "OlistDeliveryModel"
  model_alias: "champion"

service:
  default_model_version: "latest"
